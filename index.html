<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Printปุ๊บ รู้ปั๊บ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ต้นแบบเว็บแอปสั่งพิมพ์และติดตามคิวงานของร้านถ่ายเอกสาร">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky royal-blue app bar (the shop sign's blue); centred work area (narrow column for customers, phone-first with a bottom tab bar;
   wide lane board for staff; tile + chart grid for the manager). Palette: sign blue with paper whites, CMYK process colours for status. */
:root {
  --paper: #F2F4F9;
  --surface: #FFFFFF;
  --surface-2: #ECEFF6;
  --ink: #121826;
  --ink-2: #2A3245;
  --muted: #566074;
  --line: #DADFEA;
  --line-2: #C4CBDB;
  --cyan: #2547B8;
  --cyan-ink: #1E3C9F;
  --cyan-soft: #E5EBFA;
  --magenta: #BE1B5C;
  --magenta-soft: #FBE4ED;
  --yellow: #8A6700;
  --yellow-soft: #FFF3CC;
  --yellow-ink: #F2C200;
  --green: #187A49;
  --green-soft: #DDF2E6;
  --orange: #A84B0A;
  --orange-soft: #FDE8D7;
  --gray-soft: #E7EAF1;
  --on-accent: #FFFFFF;
  --bar-bg: #2445B0;
  --bar-line: #1B3590;
  --bar-fg: #FFFFFF;
  --bar-muted: #D3DCFA;
  --bar-accent: #FFD54A;
  --bar-hover: rgba(255, 255, 255, .13);
  --bar-active-bg: #FFFFFF;
  --bar-active-fg: #1E3C9F;
  --bar-ctl: rgba(255, 255, 255, .32);
  --scrim: rgba(10, 16, 34, .48);
  --shadow: 0 1px 2px rgba(18, 24, 38, .05), 0 4px 14px rgba(18, 24, 38, .06);
  --shadow-lg: 0 2px 6px rgba(18, 24, 38, .08), 0 16px 40px rgba(18, 24, 38, .14);
  --f-display: 'Bai Jamjuree', 'IBM Plex Sans Thai', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', 'Noto Sans Thai', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 14px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1018; --surface: #141A26; --surface-2: #1B2231; --ink: #E7ECF7; --ink-2: #C9D1E3; --muted: #97A2B8; --line: #283142; --line-2: #354055;
    --cyan: #7F9DF2; --cyan-ink: #A2B8F8; --cyan-soft: #172347; --magenta: #F0669E; --magenta-soft: #3A1627; --yellow: #E7C24A; --yellow-soft: #2E270C; --yellow-ink: #E7C24A;
    --green: #4CC487; --green-soft: #102E1F; --orange: #F09A55; --orange-soft: #36210F; --gray-soft: #222A38;
    --on-accent: #0A1430; --bar-bg: #162453; --bar-line: #0E1838; --bar-fg: #E8EEFF; --bar-muted: #A8B7E6; --bar-accent: #FFD54A; --bar-hover: rgba(255,255,255,.08); --bar-active-bg: #2B408A; --bar-active-fg: #FFFFFF; --bar-ctl: rgba(255,255,255,.2);
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3); --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1018; --surface: #141A26; --surface-2: #1B2231; --ink: #E7ECF7; --ink-2: #C9D1E3; --muted: #97A2B8; --line: #283142; --line-2: #354055;
  --cyan: #7F9DF2; --cyan-ink: #A2B8F8; --cyan-soft: #172347; --magenta: #F0669E; --magenta-soft: #3A1627; --yellow: #E7C24A; --yellow-soft: #2E270C; --yellow-ink: #E7C24A;
  --green: #4CC487; --green-soft: #102E1F; --orange: #F09A55; --orange-soft: #36210F; --gray-soft: #222A38;
  --on-accent: #0A1430; --bar-bg: #162453; --bar-line: #0E1838; --bar-fg: #E8EEFF; --bar-muted: #A8B7E6; --bar-accent: #FFD54A; --bar-hover: rgba(255,255,255,.08); --bar-active-bg: #2B408A; --bar-active-fg: #FFFFFF; --bar-ctl: rgba(255,255,255,.2);
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3); --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar-bg); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-size: 1.75rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--cyan-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.ic { flex: none; display: block; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.sec-h { font-size: 1.02rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app bar ---------- */
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar-bg); border-bottom: 1px solid var(--bar-line); color: var(--bar-fg); }
.topbar :focus-visible { outline-color: var(--bar-accent); }
.topbar .bar { display: flex; align-items: center; gap: 14px; padding-block: 10px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 9px; color: var(--bar-fg); background: none; border: 0; padding: 0; }
.brand-mark { display: grid; grid-template-columns: repeat(2, 7px); gap: 2px; }
.brand-mark i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.brand-mark i:nth-child(1) { background: #00A6DA; } .brand-mark i:nth-child(2) { background: #E2177C; }
.brand-mark i:nth-child(3) { background: #F4C600; } .brand-mark i:nth-child(4) { background: var(--bar-fg); }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.14rem; letter-spacing: -.01em; white-space: nowrap; }
.brand-name b { color: var(--bar-accent); font-weight: 700; }
.nav { display: flex; gap: 2px; }
.nav button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 8px 12px; border-radius: 9px; color: var(--bar-muted); font-weight: 500; }
.nav button:hover { background: var(--bar-hover); color: var(--bar-fg); }
.nav button[aria-current="page"] { background: var(--bar-active-bg); color: var(--bar-active-fg); }
.bar-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.topbar .iconbtn, .topbar .userbtn { background: transparent; border-color: var(--bar-ctl); color: var(--bar-fg); }
.topbar .iconbtn:hover, .topbar .userbtn:hover { background: var(--bar-hover); }
.topbar .userbtn .who span { color: var(--bar-muted); }
.topbar .badge { box-shadow: 0 0 0 2px var(--bar-bg); }
.iconbtn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink); }
.iconbtn:hover { background: var(--surface-2); }
.badge { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--magenta); color: #fff; font-size: .7rem; font-weight: 600; display: grid; place-items: center; line-height: 1; }
.userbtn { display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 4px 10px 4px 4px; max-width: 240px; color: var(--ink); }
.userbtn:hover { background: var(--surface-2); }
.avatar { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-weight: 600; font-size: .88rem; flex: none; }
.avatar.customer { background: var(--cyan-soft); color: var(--cyan-ink); }
.avatar.staff { background: var(--yellow-soft); color: var(--yellow); }
.avatar.manager { background: var(--magenta-soft); color: var(--magenta); }
.userbtn .who { display: flex; flex-direction: column; line-height: 1.2; text-align: left; min-width: 0; }
.userbtn .who b { font-weight: 600; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.userbtn .who span { font-size: .72rem; color: var(--muted); }
.pop-anchor { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); width: 300px; max-width: calc(100vw - 32px); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 40; }
.pop-h { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 6px; }
.pop .label { font-size: .72rem; color: var(--muted); padding: 8px 10px 2px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.mitem { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 9px; color: var(--ink); }
.mitem:hover { background: var(--surface-2); }
.mitem .sub { display: block; font-size: .78rem; color: var(--muted); }
.notif-pop { width: 360px; max-height: min(480px, 70vh); overflow-y: auto; }
.nrow { width: 100%; display: grid; grid-template-columns: 10px 1fr; gap: 10px; text-align: left; border: 0; background: none; padding: 10px; border-radius: 10px; color: var(--ink); }
.nrow:hover { background: var(--surface-2); }
.nrow .ndot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: transparent; }
.nrow.new .ndot { background: var(--cyan); }
.nrow .ntext { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.nrow .ntext span { color: var(--muted); font-size: .86rem; }
.nrow .ntext .nt { font-size: .76rem; }
.linkbtn { border: 0; background: none; color: var(--cyan-ink); font-weight: 500; padding: 4px 6px; border-radius: 6px; }
.linkbtn:hover { background: var(--cyan-soft); }
.banner { font-size: .88rem; }
.banner .wrap { padding-block: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--orange-soft); }
.banner.info { background: var(--yellow-soft); }

/* bottom tab bar (customer, phone) */
.tabbar { display: none; }
@media (max-width: 720px) {
  .nav.cust { display: none; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
  .tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: .74rem; font-weight: 500; padding: 4px 0; border-radius: 10px; }
  .tabbar button[aria-current="page"] { color: var(--cyan-ink); }
  .tabbar .tab-main .ic { background: var(--cyan); color: var(--on-accent); border-radius: 12px; padding: 6px; width: 36px; height: 36px; }
  .tabbar .badge { top: -2px; right: calc(50% - 22px); }
  body.has-tabbar main { padding-bottom: calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom, 0px)); }
  body.has-tabbar .toasts { bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px)); }
  body.has-tabbar .foot { display: none; }
}

/* ---------- main ---------- */
main { padding-block: 24px 64px; min-height: 60vh; }
.page { display: flex; flex-direction: column; gap: 18px; }
.narrow { max-width: 680px; margin: 0 auto; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.page-head p { margin-top: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.card.flat { box-shadow: none; }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 24px; text-align: center; color: var(--muted); background: var(--surface); }
.note { border-radius: 11px; padding: 11px 13px; font-size: .92rem; background: var(--surface-2); display: flex; gap: 10px; align-items: flex-start; }
.note .ic { margin-top: 3px; }
.note.warn { background: var(--orange-soft); }
.note.info { background: var(--cyan-soft); }
.note.bad { background: var(--magenta-soft); }
.note.ok { background: var(--green-soft); }
.note b { font-weight: 600; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); padding: 4px 6px 4px 0; font-weight: 500; align-self: flex-start; }
.back:hover { color: var(--ink); }
.foot { border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
.foot .wrap { padding-block: 18px; display: flex; gap: 8px 18px; flex-wrap: wrap; justify-content: space-between; }

/* ---------- buttons & fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 500; text-decoration: none; color: var(--ink); white-space: nowrap; transition: background .15s, border-color .15s, filter .15s; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--cyan); border-color: var(--cyan); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); background: var(--cyan); }
.btn.success { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.danger { color: var(--magenta); }
.btn.danger.solid { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 11px; font-size: .85rem; border-radius: 8px; min-height: 32px; }
.btn.lg { padding: 12px 20px; font-size: 1.02rem; min-height: 48px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: .88rem; font-weight: 500; min-width: 0; }
.field .hint, .hint { font-weight: 400; color: var(--muted); font-size: .8rem; }
.input, select.input, textarea.input { width: 100%; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); min-width: 0; min-height: 42px; }
.input:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 3px var(--cyan-soft); }
textarea.input { resize: vertical; min-height: 70px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.pw { position: relative; }
.pw .input { padding-right: 46px; }
.pw button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 34px; border: 0; background: none; color: var(--muted); border-radius: 8px; display: grid; place-items: center; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--cyan); width: 17px; height: 17px; flex: none; }
.switch { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 14px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; width: 46px; height: 26px; border-radius: 13px; background: var(--line-2); position: relative; flex: none; transition: background .15s; cursor: pointer; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--cyan); }
.switch input:checked::after { transform: translateX(20px); }
.switch input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.form-error { color: var(--magenta); font-size: .88rem; }
.form-error:empty { display: none; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 10px 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cyan); }

/* ---------- status pill, progress ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; background: var(--gray-soft); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.yellow { background: var(--yellow-soft); color: var(--yellow); }
.pill.orange { background: var(--orange-soft); color: var(--orange); }
.pill.magenta { background: var(--magenta-soft); color: var(--magenta); }
.pill.cyan { background: var(--cyan-soft); color: var(--cyan-ink); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.gray { background: var(--gray-soft); color: var(--muted); }
.tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 6px; font-size: .72rem; font-weight: 600; border: 1px solid currentColor; }
.tag.urgent { color: var(--magenta); }
.tag.late { color: var(--orange); }
.code { font-family: var(--f-mono); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.stepper { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.stepper .st { display: flex; flex-direction: column; gap: 5px; font-size: .7rem; color: var(--muted); min-width: 0; }
.stepper .st::before { content: ""; height: 5px; border-radius: 3px; background: var(--surface-2); }
.stepper .st.done::before { background: var(--cyan); }
.stepper .st.now::before { background: linear-gradient(90deg, var(--cyan) 55%, var(--surface-2) 55%); }
.stepper .st.now { color: var(--ink); font-weight: 600; }
.stepper .st span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper.off .st::before { background: var(--surface-2); }
.st-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.tone-yellow .st-ic, .st-ic.tone-yellow { background: var(--yellow-soft); color: var(--yellow); }
.tone-orange .st-ic, .st-ic.tone-orange { background: var(--orange-soft); color: var(--orange); }
.tone-magenta .st-ic, .st-ic.tone-magenta { background: var(--magenta-soft); color: var(--magenta); }
.tone-cyan .st-ic, .st-ic.tone-cyan { background: var(--cyan-soft); color: var(--cyan-ink); }
.tone-green .st-ic, .st-ic.tone-green { background: var(--green-soft); color: var(--green); }
.tone-gray .st-ic, .st-ic.tone-gray { background: var(--gray-soft); color: var(--muted); }
.prog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.prog li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; position: relative; padding-bottom: 16px; }
.prog li:last-child { padding-bottom: 0; }
.prog li::after { content: ""; position: absolute; left: 12px; top: 26px; bottom: 2px; width: 2px; background: var(--line); }
.prog li:last-child::after { display: none; }
.prog li.done::after { background: var(--cyan); }
.prog .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); display: grid; place-items: center; color: var(--on-accent); }
.prog li.done .dot { background: var(--cyan); border-color: var(--cyan); }
.prog li.now .dot { border-color: var(--cyan); box-shadow: 0 0 0 4px var(--cyan-soft); }
.prog li.now .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); }

<script>
/* Domain rules shared by the app and the demo-data generator:
   pricing, paper use and print-time estimates. */
(function (root) {
  'use strict';
  const DEFAULT_SETTINGS = {
    shopOpen: true,      // เปิด/ปิดรับงาน
    lines: 2,            // เครื่องพิมพ์ที่ทำงานพร้อมกัน
    bwPpm: 35,           // ความเร็วขาวดำ (หน้า/นาที)
    colorPpm: 15,        // ความเร็วสี (หน้า/นาที)
    setupMin: 2,         // เวลาเตรียมงานต่อคำสั่งพิมพ์ (นาที)
    qrExpiryMin: 15,     // อายุ QR ชำระเงิน (นาที)
    payTimeoutHours: 24  // ยกเลิกอัตโนมัติถ้าไม่ชำระภายใน (ชม.)
  };
  const r2 = n => Math.round((+n || 0) * 100) / 100;
  const list = rates => Object.values(rates || {});
  function printRate(rates, paper, color) {
    return list(rates).find(r => r.kind === 'print' && r.active !== false && r.paper === paper && r.color === color) || null;
  }
  function bindingRate(rates, id) {
    if (!id || id === 'none') return null;
    const b = (rates || {})[id];
    return b && b.kind === 'binding' ? b : null;
  }
  function urgentRate(rates) {
    return list(rates).find(r => r.kind === 'extra' && r.code === 'urgent' && r.active !== false) || null;
  }
  // กระดาษที่ใช้ (แผ่น)
  function sheetsOf(it) {
    const p = Math.max(0, +it.pages || 0), c = Math.max(0, +it.copies || 0);
    return (it.sides === 'double' ? Math.ceil(p / 2) : p) * c;
  }
  // ราคาต่อรายการ = หน้า × เรตตามขนาด/สี × ชุด + ค่าเข้าเล่ม × ชุด
  function itemPrice(it, rates) {
    const pr = printRate(rates, it.paper, it.color);
    const pages = +it.pages || 0, copies = +it.copies || 0;
    const print = pr ? pr.price * pages * copies : 0;
    const b = bindingRate(rates, it.bindingId);
    const bind = b ? b.price * copies : 0;
    return { print: r2(print), bind: r2(bind), total: r2(print + bind), missingRate: !pr };
  }
  // เวลาพิมพ์ต่อรายการ (นาที)
  function itemMinutes(it, rates, st) {
    const imp = (+it.pages || 0) * (+it.copies || 0);
    const ppm = it.color === 'color' ? st.colorPpm : st.bwPpm;
    let m = imp / Math.max(1, +ppm || 1) * (it.sides === 'double' ? 1.15 : 1);
    const b = bindingRate(rates, it.bindingId);
    if (b) m += (+b.minutes || 0) * (+it.copies || 0);
    return m;
  }
  function estimateOrder(items, urgent, rates, st) {
    let total = 0, minutes = +st.setupMin || 0, sheets = 0, pages = 0;
    (items || []).forEach(it => {
      total += itemPrice(it, rates).total;
      minutes += itemMinutes(it, rates, st);
      sheets += sheetsOf(it);
      pages += (+it.pages || 0) * (+it.copies || 0);
    });
    const ur = urgent ? urgentRate(rates) : null;
    if (ur) total += ur.price;
    return { total: r2(total), minutes: Math.max(1, Math.ceil(minutes)), sheets, pages, urgentFee: ur ? ur.price : 0 };
  }
  const api = { DEFAULT_SETTINGS, r2, printRate, bindingRate, urgentRate, sheetsOf, itemPrice, itemMinutes, estimateOrder };
  root.PP = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Demo data for the prototype. Every person, order and payment here is fictional.
   makeSeed(t, hash) builds a full data set relative to time t. */
(function (root) {
  'use strict';
  const PP = root.PP || (typeof require !== 'undefined' ? require('./domain.js') : null);
  const MIN = 60000, HOUR = 3600000, DAY = 86400000;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  async function makeSeed(t, hash) {
    const R = mulberry32(20261104);
    const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
    const pick = a => a[Math.floor(R() * a.length)];
    const day0 = (() => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); })();
    const settings = Object.assign({}, PP.DEFAULT_SETTINGS);

    // ---------- rates (ราคาตัวอย่าง แก้ได้ในหน้า "ข้อมูลร้าน") ----------
    const rates = {};
    const addRate = (id, o) => { rates[id] = Object.assign({ id, active: true }, o); };
    addRate('r_a4bw', { kind: 'print', name: 'A4 ขาวดำ', paper: 'A4', color: 'bw', price: 1, unit: 'หน้า', sort: 1 });
    addRate('r_a4c', { kind: 'print', name: 'A4 สี', paper: 'A4', color: 'color', price: 5, unit: 'หน้า', sort: 2 });
    addRate('r_a3bw', { kind: 'print', name: 'A3 ขาวดำ', paper: 'A3', color: 'bw', price: 3, unit: 'หน้า', sort: 3 });
    addRate('r_a3c', { kind: 'print', name: 'A3 สี', paper: 'A3', color: 'color', price: 12, unit: 'หน้า', sort: 4 });
    addRate('r_staple', { kind: 'binding', name: 'เย็บมุม', price: 2, unit: 'ชุด', minutes: 0.5, sort: 5 });
    addRate('r_comb', { kind: 'binding', name: 'เข้าเล่มสันห่วง', price: 35, unit: 'ชุด', minutes: 5, sort: 6 });
    addRate('r_glue', { kind: 'binding', name: 'เข้าเล่มสันกาว', price: 40, unit: 'ชุด', minutes: 8, sort: 7 });
    addRate('r_urgent', { kind: 'extra', code: 'urgent', name: 'งานด่วน (ขึ้นคิวก่อน)', price: 20, unit: 'งาน', sort: 8 });

    // ---------- users (รหัสผ่านบัญชีทดลองทุกบัญชี: 1234) ----------
    const userDefs = [
      ['u_mind', 'mind', 'มายด์ กานต์ธิดา', 'customer', '0812340001', 'ลูกค้า A'],
      ['u_bank', 'bank', 'แบงก์ ธนพล', 'customer', '0812340002', 'ลูกค้า B'],
      ['u_ploy', 'ploy', 'พลอย ชนิดา', 'customer', '0812340003', ''],
      ['u_tonkla', 'tonkla', 'ต้นกล้า ภูมิพัฒน์', 'customer', '0812340004', ''],
      ['u_fah', 'fah', 'ฟ้า ณิชาภา', 'customer', '0812340005', ''],
      ['u_staff', 'staff', 'นก วรรณา', 'staff', '0812340010', 'พนักงาน A'],
      ['u_staff2', 'staff2', 'เอ็ม อนุชา', 'staff', '0812340011', ''],
      ['u_manager', 'manager', 'ผู้จัดการร้าน', 'manager', '0812340020', 'ผู้จัดการ']
    ];
    const users = {};
    for (const [id, username, name, role, phone, demoLabel] of userDefs) {
      const salt = 's' + Math.floor(R() * 1e9).toString(36);
      users[id] = {
        id, username, name, role, phone, active: true, demo: true, demoLabel,
        salt, passHash: await hash(salt + ':1234'), createdAt: day0 - 30 * DAY
      };
    }
    const customers = ['u_mind', 'u_bank', 'u_ploy', 'u_tonkla', 'u_fah'];

    const files = ['รายงานกลุ่ม_บทที่1-3.pdf', 'Lecture_Slides_W9.pdf', 'แบบฟอร์มฝึกงาน.pdf', 'Resume_2026.pdf',
      'สรุปชีท_Midterm.pdf', 'ใบงาน_สถิติ.pdf', 'Thesis_Draft_v2.pdf', 'Portfolio.pdf', 'ข้อสอบเก่า_ECON.pdf',
      'Case_Study_Marketing.pdf', 'Lab_Report_Chem.pdf', 'Reading_Pack_HIST.pdf'];
    const hours = [8, 8, 9, 9, 10, 11, 12, 12, 13, 13, 14, 15, 16, 16, 17, 17, 18];

    const orders = {}, payments = {}, notifications = {};
    let seq = 3;
    let pid = 0, nid = 0;
    const H = (at, status, by, byName, note) => ({ at, status, by, byName, note: note || '' });
    const staffBy = () => (R() < 0.6 ? ['u_staff', 'นก วรรณา'] : ['u_staff2', 'เอ็ม อนุชา']);

    function randomItem() {
      const kind = R();
      if (kind < 0.18) { // แบบฟอร์ม/ใบงาน หลายชุด
        return { fileName: pick(['แบบฟอร์มฝึกงาน.pdf', 'ใบงาน_สถิติ.pdf', 'ข้อสอบเก่า_ECON.pdf']), pages: ri(1, 4), paper: 'A4', color: 'bw', sides: 'single', copies: ri(10, 40), bindingId: R() < 0.5 ? 'r_staple' : 'none' };
      }
      if (kind < 0.30) { // งานสี
        return { fileName: pick(['Resume_2026.pdf', 'Portfolio.pdf', 'Lecture_Slides_W9.pdf']), pages: ri(2, 30), paper: 'A4', color: 'color', sides: R() < 0.4 ? 'double' : 'single', copies: ri(1, 3), bindingId: R() < 0.3 ? 'r_glue' : 'none' };
      }
      if (kind < 0.36) {
        return { fileName: 'Poster_A3_Final.pdf', pages: 1, paper: 'A3', color: 'color', sides: 'single', copies: ri(1, 4), bindingId: 'none' };
      }
      const pages = ri(8, 120);
      return { fileName: pick(files), pages, paper: 'A4', color: 'bw', sides: pages > 12 && R() < 0.6 ? 'double' : 'single', copies: R() < 0.8 ? 1 : ri(2, 5), bindingId: pages > 40 ? pick(['r_comb', 'r_glue', 'none']) : (R() < 0.4 ? 'r_staple' : 'none') };
    }

    function addPayment(o, amount, status, paidAt, extra) {
      pid++;
      const id = 'p_seed_' + pid;
      payments[id] = Object.assign({
        id, txnId: 'TXN-' + String(40000000 + pid * 7919).slice(0, 8), orderId: o.id, customerId: o.customerId,
        amount: o.quotedPrice, receivedAmount: amount, status, method: 'PromptPay QR (Sandbox)',
        createdAt: paidAt - ri(1, 4) * MIN, expiresAt: paidAt - MIN + settings.qrExpiryMin * MIN, paidAt,
        verifyMs: ri(280, 900), events: [{ at: paidAt, type: 'payment.successful', amount }], duplicateCount: 0
      }, extra || {});
      return id;
    }
    function addNotif(userId, orderId, title, body, at, read) {
      nid++;
      const id = 'n_seed_' + nid;
      notifications[id] = { id, userId, orderId, title, body, createdAt: at, read: !!read, channels: ['web'] };
    }

    function completedOrder(sub, forceToday) {
      const customerId = pick(customers);
      const nItems = R() < 0.2 ? 2 : 1;
      const items = [];
      for (let i = 0; i < nItems; i++) items.push(randomItem());
      const urgent = R() < 0.08;
      const est = PP.estimateOrder(items, urgent, rates, settings);
      const id = 'o_seed_' + seq;
      const code = 'JOB-' + String(seq).padStart(3, '0');
      seq++;
      const [sid, sname] = staffBy();
      const quotedAt = sub + ri(3, 12) * MIN;
      const o = {
        id, code, customerId, items, urgent, note: '', status: 'completed', estPrice: est.total, quotedPrice: est.total,
        durationMin: est.minutes, createdAt: sub, submittedAt: sub, quotedAt, quotedBy: sid
      };
      if (R() < 0.07 && !forceToday) { // ไม่ชำระ ระบบยกเลิกอัตโนมัติ
        o.status = 'cancelled'; o.cancelledAt = quotedAt + settings.payTimeoutHours * HOUR;
        o.history = [H(sub, 'review', customerId, '', 'ส่งคำสั่งพิมพ์'), H(quotedAt, 'awaiting_payment', sid, sname, 'เสนอราคา ฿' + est.total.toFixed(2)), H(o.cancelledAt, 'cancelled', 'system', 'ระบบ', 'ไม่ชำระภายในเวลาที่กำหนด')];
        return o;
      }
      o.paidAt = quotedAt + ri(2, 20) * MIN;
      o.startedAt = o.paidAt + ri(2, 25) * MIN;
      o.readyAt = o.startedAt + est.minutes * MIN + ri(0, 6) * MIN;
      o.completedAt = o.readyAt + ri(8, 150) * MIN;
      o.pickupCode = String(ri(1000, 9999));
      o.paymentId = addPayment(o, est.total, 'successful', o.paidAt);
      o.history = [
        H(sub, 'review', customerId, '', 'ส่งคำสั่งพิมพ์'),
        H(quotedAt, 'awaiting_payment', sid, sname, 'เสนอราคา ฿' + est.total.toFixed(2)),
        H(o.paidAt, 'queued', 'system', 'ระบบ', 'ชำระเงินสำเร็จผ่าน Payment Gateway'),
        H(o.startedAt, 'printing', sid, sname, ''),
        H(o.readyAt, 'ready', sid, sname, ''),
        H(o.completedAt, 'completed', sid, sname, 'ส่งมอบงาน ยืนยันด้วยรหัสรับงาน')
      ];
      return o;
    }

    // ---------- 6 วันก่อนหน้า ----------
    for (let d = 6; d >= 1; d--) {
      const n = ri(5, 9);
      const subs = [];
      for (let i = 0; i < n; i++) subs.push(day0 - d * DAY + pick(hours) * HOUR + ri(0, 59) * MIN);
      subs.sort((a, b) => a - b);
      subs.forEach(s => { const o = completedOrder(s); orders[o.id] = o; });
    }
    // ---------- วันนี้: งานที่เสร็จไปแล้ว ----------
    for (let k = 4; k >= 1; k--) {
      const s = t - (170 + k * 50) * MIN;
      if (s < day0 + 8 * HOUR) continue;
      const o = completedOrder(s, true);
      if (o.completedAt > t - 5 * MIN) { o.completedAt = t - 5 * MIN; o.history[o.history.length - 1].at = o.completedAt; }
      orders[o.id] = o;
    }
    let qn = Object.values(orders).filter(o => o.paidAt && o.paidAt >= day0).length;

    // ---------- งานที่กำลังดำเนินการ (ตรงกับ Test Case ของกลุ่ม) ----------
    function active(id, code, customerId, items, urgent, status, times, extra) {
      const est = PP.estimateOrder(items, urgent, rates, settings);
      const o = Object.assign({
        id, code, customerId, items, urgent, note: '', status, estPrice: est.total, durationMin: est.minutes,
        createdAt: times.sub, submittedAt: times.sub
      }, extra || {});
      o.history = [H(times.sub, 'review', customerId, '', 'ส่งคำสั่งพิมพ์')];

  async function login(username, pw) {

    if (!name || !pw) throw new Error('กรอกชื่อผู้ใช้และรหัสผ่าน');
    const u = Object.values(S.users).find(x => x.username === name);
    if (!u) throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    if (u.active === false) throw new Error('บัญชีนี้ถูกปิดใช้งาน ติดต่อผู้จัดการร้าน');
    const h = await sha256hex(u.salt + ':' + pw);
    if (h !== u.passHash) throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    setSession(u.id);
  }

    const b = PP.bindingRate(S.rates, c.bindingId); if (b) c.bindingName = b.name;

    async createPayment(me, id) {

      const p = { id: uid('p'), txnId: 'TXN-' + digits(8), orderId: o.id, customerId: o.customerId, amount: o.quotedPrice, status: 'pending', method: 'PromptPay QR (Sandbox)', createdAt: now(), expiresAt: now() + cfg().qrExpiryMin * MIN, events: [], duplicateCount: 0 };

    // Backend รับผลจาก Payment Gateway (Webhook) → ตรวจรายการ ยอดเงิน และกันบันทึกซ้ำ ก่อนเปลี่ยนสถานะ
    async gatewayWebhook(paymentId, ev) {
      const t0 = performance.now();
      if (!S.payments[paymentId]) throw new Error('ไม่พบรายการชำระเงิน');
      const p = clone(S.payments[paymentId]);
      p.events = (p.events || []).concat([{ at: now(), type: ev.type, amount: ev.amount }]);
      if (ev.type === 'payment.successful' && ['successful', 'mismatch', 'accepted', 'refund'].includes(p.status)) {
        p.duplicateCount = (p.duplicateCount || 0) + 1;
        await Store.put('payments', p.id, p);
        await this.audit(null, 'webhook.duplicate', `${p.txnId} ได้รับผลชำระซ้ำ ไม่บันทึกยอด คิว หรือแจ้งเตือนซ้ำ`);
        return { kind: 'duplicate', count: p.duplicateCount };
      }
      if (ev.type === 'payment.expired' || p.status !== 'pending' || p.expiresAt < now()) {
        if (p.status === 'pending') p.status = 'expired';
        await Store.put('payments', p.id, p);
        return { kind: 'expired' };
      }
      const o = this.latest(p.orderId);
      p.receivedAmount = PP.r2(ev.amount); p.paidAt = now();
      if (o.status !== 'awaiting_payment' || Math.abs(p.receivedAmount - p.amount) > 0.004) {
        p.status = 'mismatch';
        o.paymentId = p.id;
        if (ACTIVE.includes(o.status)) this.push(o, 'payment_review', null, `ยอดที่ได้รับ ${money(p.receivedAmount)} ไม่ตรงกับยอดที่ต้องชำระ ${money(p.amount)}`);
        await Store.put('orders', o.id, o);
        p.verifyMs = Math.round(performance.now() - t0);
        await Store.put('payments', p.id, p);
        await this.notify(o.customerId, o.id, 'ยอดชำระไม่ตรง', `${o.code} ร้านได้รับ ${money(p.receivedAmount)} จาก ${money(p.amount)} พนักงานกำลังตรวจสอบ ไม่ต้องชำระซ้ำ`);
        return { kind: 'mismatch' };
      }
      p.status = 'successful';
      this.enqueue(o, p.id, null, 'ชำระเงินสำเร็จผ่าน Payment Gateway');
      await Store.put('orders', o.id, o);
      p.verifyMs = Math.round(performance.now() - t0);
      await Store.put('payments', p.id, p);
      const q = computeQueue()[o.id];
      await this.notify(o.customerId, o.id, 'ชำระเงินสำเร็จ', `${o.code} คิวที่ ${o.queueNo} · คาดว่าเสร็จประมาณ ${fmtTime(q ? q.eta : now())} · รหัสรับงาน ${o.pickupCode}`);
      return { kind: 'success', ms: p.verifyMs };
    },

      this.push(o, 'queued', by, note);
    },

    const run = async (list, fn) => {

  // ---------------------------------------------------------------- PDF page count
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  let pdfReady = null;
  function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  function loadPdfJs() {
    if (!pdfReady) pdfReady = (async () => { await loadScript(PDFJS_WORKER); await loadScript(PDFJS); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; })()
      .catch(e => { pdfReady = null; throw e; }); // a failed CDN load can be retried on the next file
    return pdfReady;
  }
  async function countPdfPages(file) {
    try {
      await loadPdfJs();
      const task = window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) });
      const n = (await task.promise).numPages; task.destroy(); return n;
    } catch (e) {
      try {
        const txt = new TextDecoder('latin1').decode(await file.arrayBuffer());
        const m = txt.match(/\/Type\s*\/Page(?![a-zA-Z])/g);
        return m && m.length ? m.length : null;
      } catch (e2) { return null; }
    }
  }
  // Draws the first pages of a PDF into `box` (one <figure> per page). Returns the page counts.
  async function renderPdfPages(blob, box, maxPages) {
    await loadPdfJs();
    const task = window.pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) });
    const doc = await task.promise;
    const n = doc.numPages, show = Math.min(n, maxPages || 12);
    const w = Math.max(320, Math.min(900, box.clientWidth || 640));
    for (let i = 1; i <= show; i++) {
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: Math.min(2.5, (w * (window.devicePixelRatio || 1)) / base.width) });
      const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      const fig = document.createElement('figure'); fig.appendChild(c);
      const cap = document.createElement('figcaption'); cap.textContent = `หน้า ${i} จาก ${n}`; fig.appendChild(cap);
      box.appendChild(fig);
    }
    task.destroy();
    return { pages: n, shown: show };
  }

  // ---------------------------------------------------------------- print files
  // The prototype has no file server, so the customer's file is kept in this browser (IndexedDB):
  // staff can open it when they use the same computer. A real deployment keeps it in cloud storage.
  const FileStore = (() => {
    let dbP = null; const urls = new Map();
    function open() {
      if (!dbP) dbP = new Promise((res, rej) => {
        try {
          const rq = window.indexedDB.open('printpub-files', 1);
          rq.onupgradeneeded = () => rq.result.createObjectStore('files');
          rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
        } catch (e) { rej(e); }
      });
      return dbP;
    }
    async function run(mode, fn) {
      const d = await open();
      return new Promise((res, rej) => {
        const t = d.transaction('files', mode); const rq = fn(t.objectStore('files'));
        t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = t.onabort = () => rej(t.error);
      });
    }
    return {
      async save(file) { try { const id = uid('f'); await run('readwrite', st => st.put(file, id)); return { kind: 'local', id, type: file.type || '' }; } catch (e) { return null; } },
      async get(ref) { if (!ref || !ref.id) return null; try { return (await run('readonly', st => st.get(ref.id))) || null; } catch (e) { return null; } },
      async url(ref) {
        if (ref && urls.has(ref.id)) return urls.get(ref.id);
        const b = await this.get(ref); if (!b) return null;

  function progressCard(o, q) {
    if (o.status === 'cancelled') return '';

      ['ชำระเงิน', o.paidAt, null],
      ['เริ่มพิมพ์', o.startedAt, o.status === 'queued' && q ? q.start : null],
      ['พิมพ์เสร็จ พร้อมรับ', o.readyAt, (o.status === 'queued' || o.status === 'printing') && q ? q.eta : null],
      ['รับงานแล้ว', o.completedAt, null]

  // ----- file preview (staff): PDF pages drawn with pdf.js, images shown as they are
  const fpvCache = new Map(); // fileRef id -> finished preview html
  function fpvHead(o, it, url, status) {
    return `<div class="fpv-h"><span class="f-ic ${fileKind(it.fileName)}" aria-hidden="true">${esc(fileExt(it.fileName))}</span>
      <span class="fpv-t"><b class="fname">${esc(it.fileName)}</b>${status ? `<span class="small muted">${status}</span>` : ''}</span>
      ${url ? `<span class="fpv-acts"><a class="btn sm" href="${url}" target="_blank" rel="noopener">เปิดในแท็บใหม่</a><a class="btn sm" href="${url}" download="${esc(it.fileName)}">ดาวน์โหลด</a></span>` : ''}
      <button type="button" class="iconbtn" data-act="file-close" data-id="${o.id}" aria-label="ปิดตัวอย่างไฟล์">${icon('x')}</button></div>`;
  }
  async function filePreview(o, idx) {
    const it = o.items[idx]; const ref = it && it.fileRef; if (!ref) return;
    const live = () => { const b = document.getElementById('fpv-' + o.id); return b && UI.fpv && UI.fpv.oid === o.id && UI.fpv.idx === idx ? b : null; };
    let box = live(); if (!box) return;
    box.hidden = false; box.dataset.idx = String(idx);
    if (fpvCache.has(ref.id)) { box.innerHTML = fpvCache.get(ref.id); return; }
    box.innerHTML = fpvHead(o, it, null, 'กำลังเปิดไฟล์…');
    const blob = await FileStore.get(ref);
    if (!blob) {
      box = live(); if (box) box.innerHTML = fpvHead(o, it, null) + `<div class="note warn">${icon('alert')}<span>ไม่พบไฟล์นี้ในเครื่องนี้ ไฟล์จะเปิดได้เฉพาะในเบราว์เซอร์เดียวกับที่ลูกค้าใช้อัปโหลด</span></div>`;
      return;
    }
    const url = await FileStore.url(ref);
    const pages = document.createElement('div'); pages.className = 'fpv-pages';
    let info = '';
    const kind = /^image\//.test(blob.type) ? 'img' : blob.type === 'application/pdf' ? 'pdf' : fileKind(it.fileName);
    if (kind === 'img') pages.innerHTML = `<figure><img src="${url}" alt="${esc(it.fileName)}"></figure>`;
    else if (kind === 'pdf') {
      box = live(); if (box) box.innerHTML = fpvHead(o, it, url, 'กำลังแสดงหน้าไฟล์…');
      try {
        const r = await renderPdfPages(blob, pages, 12);
        info = r.pages === +it.pages
          ? `<p class="fpv-msg ok">${icon('check', 16)} ไฟล์มี ${r.pages} หน้า ตรงกับที่ลูกค้ากรอก</p>`
          : `<p class="fpv-msg warn">${icon('alert', 16)} ไฟล์มี ${r.pages} หน้า แต่ลูกค้ากรอก ${(+it.pages).toLocaleString()} หน้า</p>`;
        if (r.shown < r.pages) info += `<p class="small muted">แสดง ${r.shown} หน้าแรก กด “เปิดในแท็บใหม่” เพื่อดูทั้งไฟล์</p>`;
        pages.querySelectorAll('canvas').forEach(c => { const img = document.createElement('img'); img.src = c.toDataURL('image/jpeg', 0.85); img.alt = c.nextSibling ? c.nextSibling.textContent : ''; c.replaceWith(img); });
      } catch (e) {
        console.warn('file preview failed', e && e.message ? e.message : e);
        pages.innerHTML = '<p class="small muted">แสดงตัวอย่างในหน้านี้ไม่ได้ กด “เปิดในแท็บใหม่” หรือ “ดาวน์โหลด” เพื่อเปิดไฟล์</p>';
      }
    } else pages.innerHTML = '<p class="small muted">เว็บแสดงตัวอย่างไฟล์ชนิดนี้ไม่ได้ กด “ดาวน์โหลด” แล้วเปิดด้วยโปรแกรมในเครื่อง</p>';
    const html = fpvHead(o, it, url) + info + pages.outerHTML;
    fpvCache.set(ref.id, html);
    box = live(); if (box) box.innerHTML = html;
  }

  // ----- manager dashboard
  function dashStats() {
    const t = now(), d0 = dayStart(t), w0 = d0 - 6 * DAY;
    const os = ordersList();
    const paid = os.filter(o => o.paidAt && o.status !== 'cancelled');
    const revDays = [];
    for (let i = 6; i >= 0; i--) {
      const a = d0 - i * DAY, b = a + DAY;
      revDays.push({ label: i === 0 ? 'วันนี้' : new Date(a).toLocaleDateString('th-TH', { weekday: 'short' }), value: PP.r2(paid.filter(o => o.paidAt >= a && o.paidAt < b).reduce((s, o) => s + (+o.quotedPrice || 0), 0)) });
    }
    const hours = [];
    for (let h = 8; h <= 19; h++) hours.push({ label: String(h), value: os.filter(o => o.submittedAt >= w0 && new Date(o.submittedAt).getHours() === h).length });
    const paidToday = paid.filter(o => o.paidAt >= d0);
    let bw = 0, color = 0;
    paidToday.forEach(o => o.items.forEach(it => { const n = (+it.pages || 0) * (+it.copies || 0); if (it.color === 'color') color += n; else bw += n; }));
    const turn = os.filter(o => o.readyAt && o.paidAt && o.readyAt >= w0);
    const avgTurn = turn.length ? Math.round(turn.reduce((s, o) => s + (o.readyAt - o.paidAt), 0) / turn.length / MIN) : 0;
    const ready = os.filter(o => o.status === 'ready');
    const services = {};
    os.filter(o => o.paidAt && o.paidAt >= w0).forEach(o => o.items.forEach(it => {
      const k = `${it.paper} ${it.color === 'color' ? 'สี' : 'ขาวดำ'}`; services[k] = (services[k] || 0) + (+it.pages || 0) * (+it.copies || 0);
      const b = bindName(it); if (b) services[b] = (services[b] || 0) + (+it.copies || 0);
    }));
    return {
      ordersToday: os.filter(o => o.submittedAt >= d0).length, paidToday: paidToday.length,
      revenueToday: revDays[6].value, revenue7: PP.r2(revDays.reduce((s, d) => s + d.value, 0)), revDays, hours,
      bw, color, avgTurn, turnN: turn.length,
      inQueue: os.filter(o => o.status === 'queued').length, printing: os.filter(o => o.status === 'printing').length,
      ready: ready.length, oldestReady: ready.length ? Math.min.apply(null, ready.map(o => o.readyAt)) : null,
      statusCounts: ACTIVE.map(s => [s, os.filter(o => o.status === s).length]), services
    };
  }
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function barChart(data, opts) {
    const W = 380, H = 200, L = 38, R = 6, T = 18, B = 24;
    const max = niceMax(Math.max.apply(null, data.map(d => d.value).concat([0])));
    const iw = W - L - R, ih = H - T - B, bw = iw / data.length;
    const y = v => T + ih - (v / max) * ih;
    const peak = opts && opts.peak ? Math.max.apply(null, data.map(d => d.value)) : null;
    const fmt = v => (opts && opts.money ? (v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : String(Math.round(v))) : String(Math.round(v)));
    const grid = [0, 0.5, 1].map(f => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${L - 6}" y="${y(max * f) + 4}" text-anchor="end">${fmt(max * f)}</text>`).join('');
    const bars = data.map((d, i) => {
      const x = L + i * bw + bw * 0.18, w = bw * 0.64, h = Math.max(0, T + ih - y(d.value));
      return `<rect class="bar${peak !== null && d.value === peak && peak > 0 ? ' peak' : ''}" x="${x.toFixed(1)}" y="${y(d.value).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3"><title>${esc(d.label)}: ${d.value}</title></rect>
        ${d.value > 0 ? `<text class="val" x="${(x + w / 2).toFixed(1)}" y="${(y(d.value) - 5).toFixed(1)}" text-anchor="middle">${fmt(d.value)}</text>` : ''}
        <text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts && opts.label || 'แผนภูมิ')}">${grid}${bars}</svg>`;
  }
  const kpi = (ic, k, v, s) => `<div class="kpi"><span class="k">${icon(ic, 16)}${k}</span><span class="v">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;

  function renderModal() {

    const first = box.querySelector(sel);
    if (first && UI.modal && UI.modal.type !== 'detail') first.focus({ preventScroll: true });
    if (UI.fpv && UI.modal && S.orders[UI.fpv.oid]) filePreview(S.orders[UI.fpv.oid], UI.fpv.idx);
  }
  function openModal(m) { UI.modal = m; UI.fpv = null; UI.pop = null; UI.notifFresh = null; renderModal(); renderHeaderOnly(); }
  function closeModal() { UI.modal = null; UI.fpv = null; renderModal(); }
  function openConfirm(o) { openModal(Object.assign({ type: 'confirm' }, o)); }
  function renderBusy() {
    const b = document.getElementById('busy'); if (!b) return;
    const x = UI.busy;
    b.innerHTML = x ? `<div class="busy" role="alert"><div class="card stack"><div class="spin"></div><b>${esc(x.text)}</b><span class="small muted num">${x.done} / ${x.total}</span></div></div>` : '';
  }

  // ---------------------------------------------------------------- render
  function captureKeep(root) {
    const a = document.activeElement; const vals = {}, errs = {}, opens = {};
    root.querySelectorAll('[data-keep]').forEach(el => { if (el.id && el.value) vals[el.id] = el.value; });
    root.querySelectorAll('form[id]').forEach(f => { const e = f.querySelector('[data-err]'); if (e && e.textContent) errs[f.id] = e.textContent; });
    root.querySelectorAll('details[id]').forEach(d => { opens[d.id] = d.open; });
    return { vals, errs, opens, focus: a && root.contains(a) && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null };
  }
  function restoreKeep(k) {
    Object.keys(k.vals).forEach(id => { const el = document.getElementById(id); if (el) el.value = k.vals[id]; });
    Object.keys(k.errs).forEach(id => { const f = document.getElementById(id); const e = f && f.querySelector('[data-err]'); if (e) e.textContent = k.errs[id]; });
    Object.keys(k.opens).forEach(id => { const d = document.getElementById(id); if (d) d.open = k.opens[id]; });
    if (k.focus) { const el = document.getElementById(k.focus.id); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(k.focus.s, k.focus.e); } catch (e) { /* not a text field */ } } }
  }
  function drawQRs(root) {
    root.querySelectorAll('[data-qr]').forEach(el => {
      const text = el.getAttribute('data-qr'); el.innerHTML = '';
      if (window.QRCode) { try { new window.QRCode(el, { text, width: 186, height: 186, colorDark: '#000000', colorLight: '#ffffff', correctLevel: window.QRCode.CorrectLevel.M }); return; } catch (e) { /* fall through */ } }
      el.innerHTML = `<div class="qr-fallback">QR<br>${esc(text.split('|')[1] || '')}</div>`;
    });
  }
  function formKey() { return UI.view + '|' + UI.loginTab + '|' + (UI.draft ? UI.draft.items.map(i => i.key).join(',') + (UI.draft.editingId || '') : ''); }
  function renderHeaderOnly() {
    const top = document.getElementById('top'); if (top) top.innerHTML = headerHTML();
    const tb = document.getElementById('tabbar'); const nav = bottomNavHTML(); if (tb) tb.innerHTML = nav;
    document.body.classList.toggle('has-tabbar', !!nav);
  }
  function render(force) {
    const top = document.getElementById('top'), main = document.getElementById('main');
    if (!top || !main) return;
    if (UI.ready) {
      if (!Object.keys(S.users).length && UI.view !== 'empty') { UI.view = 'empty'; UI.me = null; force = true; }
      else if (Object.keys(S.users).length && UI.view === 'empty') { UI.view = 'login'; force = true; }
      if (UI.me && (!S.users[UI.me] || S.users[UI.me].active === false)) { UI.me = null; lsDel(LS_SESSION); UI.view = 'login'; force = true; }
    }
    renderHeaderOnly();
    const isForm = UI.view === 'c-new' || UI.view === 'login';
    if (isForm && !force && UI.formShown === formKey()) { if (UI.modal && UI.modal.type === 'detail') renderModal(); return; }
    const keep = captureKeep(main);
    main.innerHTML = viewHTML();
    restoreKeep(keep);
    UI.formShown = isForm ? formKey() : null;
    if (UI.view === 'c-new') updateDraftUI();
    drawQRs(main);
    if (UI.modal && UI.modal.type === 'detail') renderModal();
  }

  // ---------------------------------------------------------------- toasts & errors
  function toast(html, kind) {
    const box = document.getElementById('toasts'); if (!box) return;
    const t = document.createElement('div');
    t.className = 'toast' + (kind === 'error' ? ' error' : '');
    t.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    t.innerHTML = `${icon(kind === 'error' ? 'alert' : 'check', 18)}<div>${kind === 'error' ? esc(html) : html}</div>`;
    box.appendChild(t);
    setTimeout(() => t.remove(), kind === 'error' ? 6000 : 5200);
    while (box.children.length > 4) box.firstChild.remove();
  }
  function formError(f, msg) { const el = f.querySelector('[data-err]'); if (el) el.textContent = msg || ''; }

    'quick-login': async id => { const u = S.users[id]; if (u) await login(u.username, '1234'); },
    'login-tab': id => { UI.loginTab = id; render(true); },
    'toggle-pw': (id, el) => { const inp = document.getElementById(id); if (!inp) return; const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; el.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'); inp.focus(); },
    seed: () => resetDemo(false),
    'open-order': id => { const me = meUser(); if (!me || !id) return; UI.pop = null; UI.notifFresh = null; if (me.role === 'customer') go('c-order', { orderId: id }); else openModal({ type: 'detail', id }); },
    'file-preview': async id => {
      const [oid, i] = String(id).split(':'); const o = S.orders[oid]; const box = document.getElementById('fpv-' + oid);
      if (!o || !box) return;
      if (!box.hidden && box.dataset.idx === i) { box.hidden = true; UI.fpv = null; return; }
      UI.fpv = { oid, idx: +i };
      box.hidden = false; box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      await filePreview(o, +i);
    },
    'file-close': id => { const box = document.getElementById('fpv-' + id); if (box) box.hidden = true; UI.fpv = null; },
    'remove-item': id => { pendingFiles.delete(id); draftFiles.delete(id); UI.draft.items = UI.draft.items.filter(i => i.key !== id); render(true); },
    qty: (id, el) => {
      const it = UI.draft && UI.draft.items.find(x => x.key === id); if (!it) return;
      it.copies = Math.min(500, Math.max(1, (parseInt(it.copies, 10) || 0) + parseInt(el.dataset.d, 10)));
      const inp = document.getElementById('copies-' + id); if (inp) inp.value = it.copies;
      clearItemErr(id); updateDraftUI();
    },
    'edit-order': id => { const o = S.orders[id]; if (!o) return; UI.draft = draftFrom(o); go('c-new'); },
    cancel: id => openConfirm({ title: 'ยกเลิกคำสั่งพิมพ์นี้?', body: 'ร้านจะหยุดดำเนินการงานนี้ และ QR ที่ยังไม่ได้จ่ายจะใช้ไม่ได้ ยกเลิกแล้วต้องส่งคำสั่งพิมพ์ใหม่', label: 'ยกเลิกคำสั่งพิมพ์', danger: true, act: 'do-cancel', id }),
    'do-cancel': async id => { await Svc.cancel(meUser(), id, 'ลูกค้ายกเลิกเอง'); toast('ยกเลิกคำสั่งพิมพ์แล้ว'); },
    'staff-cancel': id => openConfirm({ title: 'ยกเลิกงานนี้?', body: 'ระบบจะแจ้งลูกค้าว่าคำสั่งพิมพ์ถูกยกเลิก', label: 'ยกเลิกงาน', danger: true, act: 'do-staff-cancel', id }),
    'do-staff-cancel': async id => { await Svc.cancel(meUser(), id, 'ร้านยกเลิกงาน'); toast('ยกเลิกงานแล้ว ระบบแจ้งลูกค้าแล้ว'); },
    pay: async id => { await Svc.createPayment(meUser(), id); render(); },
    'sim-pay': async (id, el) => {
      const p = S.payments[id]; if (!p) return;
      const kind = el.dataset.kind;
      if (kind === 'expire') { await Svc.gatewayWebhook(id, { type: 'payment.expired' }); toast('<b>QR หมดอายุ</b><br>ยังไม่มีการตัดเงิน ขอ QR ใหม่ได้'); return; }
      const amount = kind === 'short' ? PP.r2(Math.round(p.amount * 0.8)) : p.amount;
      const r = await Svc.gatewayWebhook(id, { type: 'payment.successful', amount });
      if (r.kind === 'success') { toast(`<b>ชำระเงินสำเร็จ</b><br>ระบบยืนยันยอดใน ${(r.ms / 1000).toFixed(2)} วินาที แล้วจัดเข้าคิว`); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      else if (r.kind === 'expired') toast('QR นี้หมดอายุแล้ว ขอ QR ใหม่เพื่อชำระ', 'error');
    },
    'sim-dup': async id => {
      const p = S.payments[id]; if (!p) return;
      const r = await Svc.gatewayWebhook(id, { type: 'payment.successful', amount: p.receivedAmount != null ? p.receivedAmount : p.amount });
      if (r.kind === 'duplicate') toast(`<b>ได้รับผลชำระซ้ำ ครั้งที่ ${r.count}</b><br>ระบบบันทึกเหตุการณ์ไว้ ไม่เพิ่มยอดหรือคิวซ้ำ`);
    },
    'read-all': () => Svc.markRead(meUser()),
    review: id => openModal({ type: 'review', id }),
    detail: id => openModal({ type: 'detail', id }),
    start: async id => { await Svc.startPrint(meUser(), id); toast('เริ่มพิมพ์แล้ว ระบบแจ้งลูกค้าแล้ว'); },
    ready: async id => { await Svc.markReady(meUser(), id); toast('งานพร้อมรับ ระบบแจ้งลูกค้าพร้อมรหัสรับงานแล้ว'); },
    delay: async id => { await Svc.delay(meUser(), id, 10); toast('ปรับเวลาเสร็จ +10 นาที ระบบแจ้งลูกค้าแล้ว'); },
    urgent: id => Svc.toggleUrgent(meUser(), id),
    handover: id => openModal({ type: 'handover', id }),
    'pay-accept': async id => { await Svc.resolvePayment(meUser(), id, true); toast('ยืนยันยอดแล้ว งานเข้าคิวพิมพ์'); },
    'pay-reject': async id => { await Svc.resolvePayment(meUser(), id, false); toast('ส่งงานกลับไปรอชำระใหม่ ระบบแจ้งลูกค้าแล้ว'); },
    'board-tab': id => { UI.boardTab = id; render(true); },
    'clear-search': () => { UI.search = ''; const s = document.getElementById('board-search'); if (s) s.value = ''; render(true); },
    'data-tab': id => { UI.dataTab = id; render(true); },
    'rate-edit': id => openModal({ type: 'rate', id }),
    'rate-del': id => { const r = S.rates[id]; openConfirm({ title: `ลบ ${r ? r.name : 'รายการ'}?`, body: 'คำสั่งพิมพ์เดิมยังเก็บราคาไว้ตามเดิม แต่ลูกค้าจะเลือกบริการนี้ไม่ได้อีก ถ้าแค่หยุดชั่วคราวให้ปิดใช้งานแทน', label: 'ลบรายการ', danger: true, act: 'do-rate-del', id }); },
    'do-rate-del': async id => { const r = S.rates[id]; await Store.del('rates', id); await Svc.audit(meUser(), 'rate.delete', r ? r.name : id); toast('ลบรายการราคาแล้ว'); },
    'user-edit': id => openModal({ type: 'user', id }),
    'user-del': id => {
      const u = S.users[id]; if (!u) return;
      if (ordersList().some(o => o.customerId === id)) { toast('ผู้ใช้นี้มีประวัติคำสั่งพิมพ์ ลบไม่ได้ ใช้ "ปิดใช้งานบัญชี" ในหน้าแก้ไขแทน', 'error'); return; }
      openConfirm({ title: `ลบบัญชี ${u.name}?`, body: 'บัญชีนี้จะเข้าสู่ระบบไม่ได้อีก', label: 'ลบบัญชี', danger: true, act: 'do-user-del', id });
    },
    'do-user-del': async id => { const u = S.users[id]; await Store.del('users', id); await Svc.audit(meUser(), 'user.delete', u ? u.username : id); toast('ลบบัญชีแล้ว'); },
    'order-del': id => { const o = S.orders[id]; openConfirm({ title: `ลบ ${o ? o.code : 'คำสั่งพิมพ์'}?`, body: 'ลบคำสั่งพิมพ์ รายการชำระ และการแจ้งเตือนของงานนี้ออกจากระบบถาวร ใช้สำหรับล้างข้อมูลทดสอบ', label: 'ลบถาวร', danger: true, act: 'do-order-del', id }); },
    'do-order-del': async id => { await Svc.deleteOrder(meUser(), id); toast('ลบคำสั่งพิมพ์แล้ว'); },
    'settings-edit': () => openModal({ type: 'settings' }),
    'reset-demo': () => openConfirm({ title: 'รีเซ็ตข้อมูลเดโม?', body: 'คำสั่งพิมพ์ การชำระเงิน การแจ้งเตือน ผู้ใช้ และราคาทั้งหมดจะถูกแทนที่ด้วยชุดตัวอย่างใหม่ตามเวลาปัจจุบัน', label: 'รีเซ็ตข้อมูล', danger: true, act: 'do-reset' }),
    'do-reset': () => resetDemo(true),
    'close-modal': () => closeModal(),
    backdrop: () => closeModal(),
    'confirm-yes': async () => { const m = UI.modal; closeModal(); if (m && A[m.act]) await A[m.act](m.id); }
  };

  // ---------------------------------------------------------------- forms
  const F = {
    'f-login': async f => { await login(f.username.value, f.password.value); },
    'f-register': async f => {
      const name = f.name.value.trim(), username = f.username.value.trim().toLowerCase(), phone = f.phone.value.trim(), pw = f.password.value;
      if (!name) throw new Error('กรอกชื่อที่แสดง');
      if (!/^[a-z0-9_.]{3,20}$/.test(username)) throw new Error('ชื่อผู้ใช้ใช้ a–z, 0–9, _ หรือ . ยาว 3–20 ตัว');
      if (Object.values(S.users).some(u => u.username === username)) throw new Error('ชื่อผู้ใช้นี้มีคนใช้แล้ว');
      if (phone && !/^0\d{8,9}$/.test(phone.replace(/[-\s]/g, ''))) throw new Error('เบอร์โทรไม่ถูกต้อง');
      if (pw.length < 4) throw new Error('รหัสผ่านอย่างน้อย 4 ตัว');
      if (pw !== f.password2.value) throw new Error('ยืนยันรหัสผ่านไม่ตรงกัน');
      const salt = 's' + Math.random().toString(36).slice(2, 10);
      const u = { id: uid('u'), username, name, phone: phone.replace(/[-\s]/g, ''), role: 'customer', active: true, salt, passHash: await sha256hex(salt + ':' + pw), createdAt: now() };
      await Store.put('users', u.id, u);
      setSession(u.id);
      toast(`<b>สมัครสมาชิกแล้ว</b><br>ยินดีต้อนรับ ${esc(firstName(name))}`);
    },
    'f-track': async f => {
      const me = meUser(); const code = f.code.value.trim().toUpperCase();
      if (!code) throw new Error('กรอกเลขงาน');
      const o = ordersList().find(x => String(x.code).toUpperCase() === code);
      if (!o || o.customerId !== me.id) {
        if (o) await Svc.audit(me, 'access.denied', `ลูกค้าพยายามเปิดงาน ${o.code} ซึ่งไม่ใช่ของตนเอง`);
        throw new Error('ไม่พบงานนี้ หรือคุณไม่มีสิทธิ์ดูงานนี้');
      }
      f.code.value = ''; go('c-order', { orderId: o.id });
    },
    'f-order': async () => {
      const d = UI.draft; const v = validateDraft(d);
      if (v.errs.length) {
        let first = null;
        Object.keys(v.byKey).forEach(k => { const c = document.querySelector(`.fitem[data-key="${k}"]`); if (c) { c.classList.add('has-err'); first = first || c; } const e = document.getElementById('ferr-' + k); if (e) e.textContent = v.byKey[k]; });
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        else if (!d.items.length) { const z = document.getElementById('dropzone'); if (z) z.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        toast(v.errs[0], 'error');
        throw new Error(v.errs.join(' · '));
      }
      for (const it of d.items) {
        const file = draftFiles.get(it.key); if (!file) continue;
        const ref = await FileStore.save(file); if (ref) it.fileRef = ref;
        draftFiles.delete(it.key);
      }
      const o = d.editingId ? await Svc.resubmit(meUser(), d.editingId, d) : await Svc.createOrder(meUser(), d);
      UI.draft = null;
      toast(`<b>ส่ง ${esc(o.code)} ให้ร้านแล้ว</b><br>ร้านจะตรวจไฟล์และแจ้งราคาให้คุณ`);
      go('c-order', { orderId: o.id });
    },
    'f-quote': async f => {
      if (!f.checked.checked) throw new Error('ติ๊กยืนยันว่าตรวจไฟล์และรูปแบบการพิมพ์แล้ว');
      await Svc.quote(meUser(), f.dataset.id, parseFloat(f.price.value), f.note.value.trim());
      closeModal(); toast('ส่งใบเสนอราคาแล้ว ลูกค้าได้รับแจ้งเตือน');
    },
    'f-revise': async f => { await Svc.requestRevision(meUser(), f.dataset.id, f.reason.value.trim()); closeModal(); toast('ตีกลับให้ลูกค้าแก้ไขแล้ว'); },
    'f-handover': async f => { await Svc.handover(meUser(), f.dataset.id, f.code.value); closeModal(); toast('ส่งมอบงานเรียบร้อย'); },
    'f-pickup': async f => {
      const code = f.code.value.trim();
      if (!/^\d{4}$/.test(code)) throw new Error('กรอกรหัสรับงาน 4 หลัก');
      const o = ordersList().find(x => x.status === 'ready' && String(x.pickupCode) === code);
      if (!o) { await Svc.audit(meUser(), 'handover.fail', `ไม่พบงานพร้อมรับด้วยรหัส ${code}`); throw new Error('ไม่พบงานที่พร้อมรับด้วยรหัสนี้'); }
      f.code.value = '';
      openModal({ type: 'handover', id: o.id, code });
    },
    'f-rate': async f => {
      const id = f.dataset.id || uid('r');
      const kind = f.kind.value, name = f.name.value.trim(), price = parseFloat(f.price.value);
      if (!name) throw new Error('กรอกชื่อรายการ');
      if (!(price >= 0)) throw new Error('กรอกราคาเป็นตัวเลข');
      const r = Object.assign({}, S.rates[id] || { sort: Object.keys(S.rates).length + 1 }, { kind, name, price: PP.r2(price), unit: f.unit.value.trim() || (kind === 'print' ? 'หน้า' : 'ชุด'), active: f.active.checked });
      if (kind === 'print') {
        r.paper = f.paper.value.trim().toUpperCase() || 'A4'; r.color = f.color.value;
        if (Object.values(S.rates).some(x => x.id !== id && x.kind === 'print' && x.paper === r.paper && x.color === r.color)) throw new Error(`มีเรต ${r.paper} ${r.color === 'color' ? 'สี' : 'ขาวดำ'} อยู่แล้ว`);
      } else { delete r.paper; delete r.color; }
      if (kind === 'binding') r.minutes = Math.max(0, parseFloat(f.minutes.value) || 0); else delete r.minutes;
      await Store.put('rates', id, r);
      await Svc.audit(meUser(), 'rate.save', `${name} ${money(r.price)}`);
      closeModal(); toast('บันทึกรายการราคาแล้ว');
    },
    'f-user': async f => {
      const id = f.dataset.id; const old = id ? S.users[id] : null; const self = old && old.id === UI.me;
      const name = f.name.value.trim(), username = f.username.value.trim().toLowerCase(), pw = f.password.value;
      if (!name) throw new Error('กรอกชื่อที่แสดง');
      if (!/^[a-z0-9_.]{3,20}$/.test(username)) throw new Error('ชื่อผู้ใช้ใช้ a–z, 0–9, _ หรือ . ยาว 3–20 ตัว');
      if (Object.values(S.users).some(u => u.username === username && u.id !== id)) throw new Error('ชื่อผู้ใช้นี้มีคนใช้แล้ว');
      if (!old && pw.length < 4) throw new Error('ตั้งรหัสผ่านอย่างน้อย 4 ตัว');
      if (old && pw && pw.length < 4) throw new Error('รหัสผ่านใหม่อย่างน้อย 4 ตัว');
      const u = Object.assign({}, old || { id: uid('u'), createdAt: now() }, { name, username, phone: f.phone.value.trim(), role: self ? old.role : f.role.value, active: self ? true : f.active.checked });
      if (pw) { u.salt = 's' + Math.random().toString(36).slice(2, 10); u.passHash = await sha256hex(u.salt + ':' + pw); }
      await Store.put('users', u.id, u);
      await Svc.audit(meUser(), old ? 'user.update' : 'user.create', `${username} (${ROLE_TH[u.role]})`);
      closeModal(); toast('บันทึกผู้ใช้แล้ว');
    },
    'f-settings': async f => {
      const n = (k, min, max) => { const v = parseFloat(f[k].value); if (!(v >= min && v <= max)) throw new Error('ตรวจตัวเลขในช่องที่กรอกอีกครั้ง'); return v; };
      const st = Object.assign({}, cfg(), { shopOpen: f.shopOpen.checked, lines: Math.round(n('lines', 1, 10)), setupMin: n('setupMin', 0, 30), bwPpm: n('bwPpm', 1, 200), colorPpm: n('colorPpm', 1, 200), qrExpiryMin: n('qrExpiryMin', 1, 120), payTimeoutHours: n('payTimeoutHours', 1, 168) });
      delete st.lineOA;
      await Store.put('settings', 'settings', st);
      await Svc.audit(meUser(), 'settings.update', st.shopOpen ? 'เปิดรับงาน' : 'ปิดรับงาน');
      closeModal(); toast('บันทึกการตั้งค่าแล้ว');
    }
  };

  // ---------------------------------------------------------------- events
  document.addEventListener('click', async e => {
    if (UI.pop && !e.target.closest('.pop-anchor')) { UI.pop = null; UI.notifFresh = null; renderHeaderOnly(); }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (act === 'backdrop' && e.target !== el) return;
    const fn = A[act]; if (!fn) return;
    e.preventDefault();
    if (el.tagName === 'BUTTON') { if (el.dataset.busy) return; el.dataset.busy = '1'; }
    try { await fn(el.dataset.id, el, e); }
    catch (err) { toast((err && err.message) || String(err), 'error'); }
    finally { if (el.isConnected) delete el.dataset.busy; }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (UI.modal) closeModal(); else if (UI.pop) { UI.pop = null; UI.notifFresh = null; renderHeaderOnly(); } }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('submit', async e => {
    const f = e.target; const fn = F[f.id]; if (!fn) return;
    e.preventDefault();
    const btns = Array.from(f.querySelectorAll('button[type=submit]'));
    if (btns.some(b => b.disabled)) return;
    btns.forEach(b => { b.disabled = true; });
    formError(f, '');
    try { await fn(f); } catch (err) { formError(f, (err && err.message) || String(err)); }
    finally { btns.forEach(b => { if (b.isConnected) b.disabled = false; }); }
  });
  let searchT = 0;
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'board-search') { UI.search = t.value; clearTimeout(searchT); searchT = setTimeout(() => render(true), 120); return; }
    if (t.type === 'radio') return;
    draftInput(e);
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-addfiles]')) { addFiles(t.files); t.value = ''; return; }
    if (t.matches('[data-file]')) { replaceFile(t.dataset.file, t.files && t.files[0]); return; }
    if (t.id === 'order-filter') { UI.orderFilter = t.value; render(true); return; }
    if (t.id === 'rt-kind') {
      document.querySelectorAll('#f-rate [data-kind-only]').forEach(el => { el.hidden = el.getAttribute('data-kind-only') !== t.value; });
      const unit = document.getElementById('rt-unit'); if (unit && !unit.dataset.touched) unit.value = t.value === 'print' ? 'หน้า' : t.value === 'binding' ? 'ชุด' : 'งาน';
      return;
    }
    if (t.id === 'rt-unit') t.dataset.touched = '1';
    draftInput(e);
  });
  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest('#dropzone'); if (!z) return; e.preventDefault(); z.classList.add('over'); }));
  document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#dropzone'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
  document.addEventListener('drop', e => {
    const z = e.target.closest && e.target.closest('#dropzone');
    if (!z) { if (UI.view === 'c-new') e.preventDefault(); return; }
    e.preventDefault(); z.classList.remove('over');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
  window.addEventListener('dragover', e => { if (UI.view === 'c-new') e.preventDefault(); });

  // timers: countdown each second, refresh estimates every 30 s, sweep overdue jobs every minute (staff/manager)
  setInterval(() => {
    document.querySelectorAll('[data-countdown]').forEach(el => {
      const left = +el.getAttribute('data-countdown') - now();
      el.textContent = left > 0 ? mmss(left) : 'หมดอายุแล้ว';
      if (left <= 0 && !el.dataset.expired) { el.dataset.expired = '1'; scheduleRender(); }
    });
  }, 1000);
  setInterval(() => { if (UI.ready && !document.hidden && !UI.pop) render(); }, 30000);
  setInterval(() => { const me = meUser(); if (UI.ready && me && me.role !== 'customer' && !document.hidden) Svc.sweep().catch(() => {}); }, 60000);

  render();
  Store.init().catch(() => Store.useLocal(false));

})();

</script>
</body></html>
